      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
      // Contact frame: real tokens from the hyperank.ai .ds-theme stylesheet.
      var SWATCHES = [
        ["Violet", "#5e4bf6"], ["Lift", "#7b6bf8"], ["Deep", "#4d3eca"],
        ["Pale", "#e7e4fe"], ["Ground", "#f0eee9"], ["Surface", "#ffffff"],
        ["Ink", "#1f1e1b"], ["Muted", "#5a564b"], ["Line", "#d6d2c7"],
      ];
      var grid = document.getElementById("ct-grid");
      SWATCHES.forEach(function (s) {
        var t = document.createElement("div");
        t.className = "ct-tile";
        t.innerHTML = '<div class="sw"></div><div class="lb"><span></span><code></code></div>';
        t.querySelector(".sw").style.background = s[1];
        if (s[1] === "#ffffff" || s[1] === "#f0eee9") t.querySelector(".sw").style.borderBottom = "1px solid #e7e4dc";
        t.querySelector("span").textContent = s[0];
        t.querySelector("code").textContent = s[1];
        grid.appendChild(t);
      });

      var hero = document.getElementById("ct-hero");
      var plain = "Every engine has an answer.".split(" ");
      var accent = "None of them is you.".split(" ");
      plain.concat(accent).forEach(function (w, i) {
        var m = document.createElement("span");
        m.className = "w";
        m.setAttribute("data-layout-allow-overflow", "");
        var inner = document.createElement(i >= plain.length ? "em" : "span");
        inner.textContent = w;
        m.appendChild(inner);
        hero.appendChild(m);
        hero.appendChild(document.createTextNode(" "));
      });

gsap.set("#hr-contact", { rotationY: -8 });
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#ct-eyebrow", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power4.out" }, 0.1);
      tl.fromTo("#ct-hero .w > *", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out", stagger: 0.04 }, 0.15);
      tl.fromTo("#ct-grid .ct-tile", { opacity: 0, y: 28, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power4.out", stagger: { each: 0.04, grid: [3, 3], from: "start" } }, 0.2);
      tl.fromTo("#ct-specs", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.55);
      window.__timelines["hr-contact"] = tl;
        })();
      </script>
