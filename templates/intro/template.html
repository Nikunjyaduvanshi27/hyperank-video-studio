<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-var.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/GeistMono-var.woff2") format("woff2"); }
      @font-face { font-family: "Supreme"; font-weight: 400; src: url("assets/fonts/Supreme-Regular.otf") format("opentype"); }
      @font-face { font-family: "Supreme"; font-weight: 600; src: url("assets/fonts/Supreme-Bold.otf") format("opentype"); }
      :root { --ink: #1a1f36; --accent: #0072de; --ground: #f3f1ec; }
      html, body { margin: 0; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Geist", sans-serif; color: var(--ink); }

      /* ---------- stage (same as the hyperank premium films, accent swapped to Celebal blue) ---------- */
      #ground { position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 42%, #ffffff 0%, #f7f6f3 40%, #ebe8e2 100%); }
      #cam { position: absolute; left: 0; top: 0; width: 1760px; height: 1000px; transform-origin: 0 0; }
      #bloomA { position: absolute; left: 80px; top: 40px; width: 1600px; height: 980px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 114, 222, 0.22), rgba(0, 114, 222, 0.06) 55%, rgba(0, 114, 222, 0) 100%); }
      .mote { position: absolute; border-radius: 50%; background: rgba(0, 114, 222, 0.42); }

      #laptop { position: absolute; left: 0; top: 0; width: 1760px; height: 1000px; }
      #contact { position: absolute; left: 40px; top: 958px; width: 1680px; height: 70px; border-radius: 50%; background: radial-gradient(closest-side, rgba(20, 34, 70, 0.42), rgba(20, 34, 70, 0.12) 60%, rgba(20, 34, 70, 0)); filter: blur(14px); }
      #ambient { position: absolute; left: 190px; top: 120px; width: 1380px; height: 840px; border-radius: 40px; box-shadow: 0 90px 160px -50px rgba(16, 60, 130, 0.36), 0 40px 80px -40px rgba(26, 23, 20, 0.28); }
      .lid { position: absolute; left: 138px; top: 0; width: 1484px; height: 956px; border-radius: 34px; background: linear-gradient(160deg, #f4f5f7 0%, #d4d6da 38%, #b9bcc1 62%, #e2e4e7 100%); }
      .lid-glass { position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px; border-radius: 30px; background: #0d0d10; overflow: hidden; }
      .webcam { position: absolute; left: 738px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #3a3a48, #101016); }
      #screen { position: absolute; left: 160px; top: 22px; width: 1440px; height: 900px; overflow: hidden; border-radius: 10px 10px 3px 3px; background: #fff; isolation: isolate; }
      #glare { position: absolute; left: 160px; top: 22px; width: 1440px; height: 900px; border-radius: 10px 10px 3px 3px; overflow: hidden; pointer-events: none;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 34%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.05) 100%); }
      #streak { position: absolute; left: 0; top: -200px; width: 260px; height: 1300px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0)); opacity: 0; }
      .hinge { position: absolute; left: 150px; top: 950px; width: 1460px; height: 9px; border-radius: 0 0 6px 6px; background: linear-gradient(#77797e, #2e2f33); }
      .deck { position: absolute; left: 0; top: 956px; width: 1760px; height: 30px; border-radius: 4px 4px 46px 46px / 4px 4px 26px 26px; background: linear-gradient(180deg, #fbfbfc 0%, #e3e5e8 22%, #c4c7cc 64%, #9da0a6 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9); }
      .notch { position: absolute; left: 760px; top: 0; width: 240px; height: 10px; border-radius: 0 0 12px 12px; background: linear-gradient(#a9acb1, #d6d8db); }

      /* the live celebaltech.com homepage, captured at 2x */
      #scroller { position: absolute; left: 0; top: 0; width: 1440px; }
      #scroller img { display: block; width: 1440px; height: __PH__px; }
      #hdr { position: absolute; left: 0; top: 0; width: 1440px; height: 60px; z-index: 5; box-shadow: 0 1px 0 rgba(26, 31, 54, 0.06); }
      #dim { position: absolute; inset: 0; background: rgb(10, 22, 48); opacity: 0; pointer-events: none; z-index: 20; }

      /* partner logos around the device (world space) */
      .wlogo { position: absolute; width: 300px; height: 150px; opacity: 0; }
      .wlogo .tile { width: 300px; height: 150px; border-radius: 36px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px -26px rgba(16, 50, 120, 0.4), 0 6px 14px -6px rgba(26, 23, 20, 0.14), inset 0 0 0 1px rgba(26, 23, 20, 0.05); }
      .wlogo .tile img { max-width: 210px; max-height: 70px; object-fit: contain; }

      /* lifted cards and industry chips (view space) */
      .lift { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; border-radius: 14px; overflow: hidden;
        box-shadow: 0 50px 90px -30px rgba(16, 50, 120, 0.5), 0 14px 30px -12px rgba(26, 23, 20, 0.25); }
      .lift img { display: block; width: 100%; height: 100%; }
      .lbl { position: absolute; left: 0; top: 0; opacity: 0; padding: 12px 20px; border-radius: 14px; background: #fff; white-space: nowrap; font-family: "Geist Mono", monospace; font-size: 19px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
        box-shadow: 0 24px 50px -24px rgba(16, 40, 100, 0.5), inset 0 0 0 1px rgba(26, 23, 20, 0.05); }
      .chip { position: absolute; height: 64px; line-height: 64px; padding: 0 28px; border-radius: 18px; background: #fff; font-size: 25px; font-weight: 480; color: var(--ink); letter-spacing: -0.014em; white-space: nowrap; opacity: 0;
        box-shadow: 0 26px 50px -24px rgba(10, 30, 90, 0.55), 0 3px 10px -4px rgba(26, 23, 20, 0.14); }
      .chip b { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 15px; color: var(--accent); margin-right: 14px; letter-spacing: 0.06em; }

      /* ---------- view space ---------- */
      #veilT { position: absolute; left: 0; top: 0; width: 1920px; height: 340px; background: linear-gradient(rgba(246, 245, 242, 0.99) 0%, rgba(246, 245, 242, 0.97) 50%, rgba(246, 245, 242, 0)); backdrop-filter: blur(20px); -webkit-mask-image: linear-gradient(#000 64%, transparent); mask-image: linear-gradient(#000 64%, transparent); opacity: 0; }
      #veilB { position: absolute; left: 0; bottom: 0; width: 1920px; height: 170px; background: linear-gradient(rgba(246, 245, 242, 0), rgba(246, 245, 242, 0.9) 48%, rgba(246, 245, 242, 0.96)); backdrop-filter: blur(16px); -webkit-mask-image: linear-gradient(transparent, #000 48%); mask-image: linear-gradient(transparent, #000 48%); opacity: 0; }
      .super { position: absolute; left: 0; top: 50px; width: 1920px; text-align: center; font-weight: 620; font-size: 78px; line-height: 1.12; letter-spacing: -0.04em; color: var(--ink); }
      .super .w { display: inline-block; opacity: 0; }
      .super .v { color: var(--accent); }
      .eyebrow { position: absolute; left: 0; top: 26px; width: 1920px; text-align: center; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.24em; text-transform: uppercase; color: #5f6474; opacity: 0; }
      .sub { position: absolute; left: 160px; width: 1600px; bottom: 30px; text-align: center; font-size: 30px; font-weight: 400; letter-spacing: -0.003em; color: #1f2333; opacity: 0; }
      #bug { position: absolute; left: 64px; top: 50px; opacity: 0; }
      #bug img { height: 46px; display: block; }
      #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #endFrost { position: absolute; left: 360px; top: 120px; width: 1200px; height: 840px; border-radius: 50%; background: radial-gradient(closest-side, rgba(248, 247, 244, 0.95), rgba(248, 247, 244, 0.84) 55%, rgba(248, 247, 244, 0)); opacity: 0; }
      #endBloom { position: absolute; left: 610px; top: 150px; width: 700px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 114, 222, 0.22), rgba(0, 114, 222, 0)); opacity: 0; }
      #endMark { position: relative; height: 128px; opacity: 0; }
      #endSuper { position: relative; margin-top: 40px; font-size: 104px; font-weight: 620; letter-spacing: -0.045em; line-height: 1; opacity: 0; }
      #endSuper .v { color: var(--accent); }
      #endSmall { position: relative; margin-top: 26px; font-size: 32px; color: #4a4f60; letter-spacing: -0.005em; opacity: 0; }
      #endUrl { position: relative; margin-top: 36px; font-family: "Supreme", sans-serif; font-weight: 600; font-size: 48px; letter-spacing: -0.01em; color: #1a1f36; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__D__" data-width="1920" data-height="1080">
      <div id="ground" data-layout-allow-occlusion></div>

      <!-- ===== world (camera) ===== -->
      <div id="cam">
        <div id="bloomA"></div>
        <div id="motes"></div>
        <div id="laptop">
          <div id="contact"></div>
          <div id="ambient"></div>
          <div class="lid"><div class="lid-glass"><div class="webcam"></div></div></div>
          <div id="screen">
            <!-- celebaltech.com homepage, captured live at 2x with the site's own fonts -->
            <div id="scroller"><img src="assets/img/page.jpg" alt="" /></div>
            <img id="hdr" src="assets/img/header.png" alt="" />
            <div id="dim" data-layout-allow-occlusion></div>
          </div>
          <div id="glare"><div id="streak"></div></div>
          <div class="hinge"></div>
          <div class="deck"><div class="notch"></div></div>
        </div>
        <div id="logos">__LOGOS__</div>
      </div>

      <!-- ===== view space ===== -->
      <div id="lifts"></div>
      <div id="chips">__CHIPS__</div>
      <div id="veilT" data-layout-allow-occlusion></div>
      <div id="veilB" data-layout-allow-occlusion></div>
      <div id="bug"><img src="assets/img/ct-logo.png" alt="" /></div>
      <div class="eyebrow" id="eb2">celebaltech.com</div>
      <div id="supers"></div>
      <div id="subs"></div>

      <div id="end">
        <div id="endFrost"></div>
        <div id="endBloom"></div>
        <img id="endMark" src="assets/img/ct-logo-end.png" alt="" />
        <div id="endSuper">Your strategic <span class="v">partner.</span></div>
        <div id="endSmall">Data, AI and Cloud solutions for the enterprise.</div>
        <div id="endUrl">celebaltech.com</div>
      </div>

__AUDIO__
    </div>

    <script>
      const DATA = __DATA__;
      const D = DATA.D;
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const SCREEN = { x: 160, y: 22, w: 1440, h: 900 };
      const HOLD = { s: 0.8, x: 960 - 0.8 * 880, y: 588 - 0.8 * 472 };
      const WIDE0 = { s: 0.47, x: 960 - 0.47 * 880, y: 640 - 0.47 * 500 };
      const WIDE1 = { s: 0.56, x: 960 - 0.56 * 880, y: 625 - 0.56 * 500 };

      DATA.supers.forEach(([a, b, txt], i) => {
        const d = document.createElement("div");
        d.className = "super"; d.id = "su" + i;
        d.innerHTML = txt.split(" ").map((w) => '<span class="w' + (w.includes("|") ? " v" : "") + '">' + w.replace(/\|/g, "") + "</span>").join(" ");
        $("#supers").appendChild(d);
        const ws = d.querySelectorAll(".w");
        ws.forEach((w) => w.setAttribute("data-layout-allow-overlap", ""));
        tl.fromTo(ws, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.05 }, a);
        tl.to(ws, { opacity: 0, y: -22, duration: 0.28, ease: "power2.in", stagger: 0.025 }, b);
      });
      DATA.subs.forEach(([a, b, txt], i) => {
        const d = document.createElement("div");
        d.className = "sub"; d.id = "sb" + i; d.textContent = txt; d.setAttribute("data-layout-allow-overlap", "");
        $("#subs").appendChild(d);
        tl.fromTo(d, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, a - 0.04);
        tl.to(d, { opacity: 0, duration: 0.16, ease: "power1.in" }, b + 0.1);
      });

      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < 18; i++) {
        const m = document.createElement("i");
        m.className = "mote";
        const r = 4 + rnd() * 7, side = i % 2 ? 1 : -1;
        const x = side > 0 ? 1640 + rnd() * 640 : -560 + rnd() * 600, y = -80 + rnd() * 1100;
        m.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + r + "px;height:" + r + "px;opacity:" + (0.18 + rnd() * 0.3);
        $("#motes").appendChild(m);
        tl.fromTo(m, { y: 0, x: 0 }, { y: -60 - rnd() * 80, x: side * (10 + rnd() * 30), duration: D, ease: "none" }, 0);
      }
      tl.fromTo("#bloomA", { opacity: 0.8, scale: 0.97 }, { opacity: 1, scale: 1.03, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // page rect (css px of the 1440-wide page) -> world (laptop) -> view (camera)
      const world = (r, S) => ({ x: SCREEN.x + r[0], y: SCREEN.y + r[1] - S, w: r[2], h: r[3] });
      const view = (f, r) => ({ x: f.x + f.s * r.x, y: f.y + f.s * r.y, w: f.s * r.w, h: f.s * r.h });
      function frame(r, cap, cy) { const s = Math.min(cap, 1920 / r.w, 770 / r.h); return { s, x: 960 - s * (r.x + r.w / 2), y: cy - s * (r.y + r.h / 2) }; }
      const cam = $("#cam"), scroller = $("#scroller");

      function build() {
        $$("#screen *, #end *, #logos *").forEach((n) => { n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-overflow", ""); });
        let S = 0, camF = WIDE0;
        gsap.set(cam, { x: WIDE0.x, y: WIDE0.y, scale: WIDE0.s, force3D: false });
        const frames = { WIDE0, WIDE1, HOLD };
        const frameFor = (a) => frames[a.to] || frame(world(a.rect, S), 1.45, 560);

        function lift(a) {
          const r0 = view(camF, world(a.rect, S));
          const c = document.createElement("div");
          c.className = "lift";
          c.innerHTML = '<img src="assets/img/' + a.img + '" alt="" />';
          c.style.width = a.rect[2] + "px"; c.style.height = a.rect[3] + "px";
          [c, ...c.querySelectorAll("*")].forEach((n) => n.setAttribute("data-layout-ignore", ""));
          $("#lifts").appendChild(c);
          const W = a.rect[2], H = a.rect[3];
          const k1 = Math.min(a.maxW / W, a.maxH / H, a.scale || 9);
          const w1 = k1 * W, h1 = k1 * H, x1 = a.cx - w1 / 2, y1 = a.cy - h1 / 2;
          gsap.set(c, { x: r0.x, y: r0.y, scale: camF.s });
          tl.set(c, { opacity: 1 }, a.t0);
          tl.to(c, { x: x1, y: y1, scale: k1, duration: 0.7, ease: "power3.out" }, a.t0);
          tl.to(c, { y: y1 - 8, duration: Math.max(0.3, a.t1 - a.t0 - 1.2), ease: "sine.inOut" }, a.t0 + 0.7);
          if (a.label) {
            const lb = document.createElement("div");
            lb.className = "lbl"; lb.textContent = a.label; lb.setAttribute("data-layout-allow-overlap", "");
            $("#lifts").appendChild(lb);
            const ly = y1 - lb.offsetHeight - 18;
            gsap.set(lb, { x: a.cx - lb.offsetWidth / 2, y: ly + 14 });
            tl.fromTo(lb, { opacity: 0, y: ly + 14 }, { opacity: 1, y: ly, duration: 0.45, ease: "power3.out", immediateRender: false }, a.t0 + 0.35);
            tl.to(lb, { opacity: 0, duration: 0.25 }, a.t1 - 0.5);
          }
          tl.to(c, { x: r0.x, y: r0.y, scale: camF.s, duration: 0.5, ease: "power2.inOut" }, a.t1 - 0.5);
          tl.set(c, { opacity: 0 }, a.t1);
        }

        const OPS = {
          cam: (a) => { const f = frameFor(a); tl.to(cam, { x: f.x, y: f.y, scale: f.s, duration: a.dur, ease: a.ease || "power2.inOut", force3D: false }, a.t); camF = f; },
          veils: (a) => tl.to(["#veilT", "#veilB"], { opacity: a.v, duration: a.dur || 0.5 }, a.t),
          bug: (a) => {
            tl.fromTo("#bug", { opacity: 0 }, { opacity: 1, duration: 0.35 }, a.t);
            tl.fromTo("#bug img", { clipPath: "inset(0 100% 0 0)", x: -8 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.7, ease: "power3.out" }, a.t);
            tl.to("#bug", { opacity: 0, duration: 0.3 }, a.t1);
          },
          logos: (a) => {
            const P = [[-470, 60], [-560, 420], [-450, 780], [1930, 40], [2020, 400], [1920, 760]];
            $$("#logos .wlogo").forEach((e, i) => {
              const [x, y] = P[i], side = x < 0 ? -1 : 1;
              e.style.left = x + "px"; e.style.top = y + "px";
              tl.fromTo(e, { opacity: 0, scale: 0.4, x: 880 - 150 - x, y: 470 - 75 - y }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, a.t + (i % 3) * 0.09 + (side > 0 ? 0.05 : 0));
              tl.to(e, { y: -14 + (i % 3) * 8, duration: Math.max(0.4, a.t1 - a.t - 1.0), ease: "sine.inOut" }, a.t + 0.85);
              tl.to(e, { opacity: 0, x: side * 200, duration: 0.45, ease: "power2.in" }, a.t1 - 0.45 + (i % 3) * 0.04);
            });
          },
          streak: (a) => { tl.fromTo("#streak", { x: -300, opacity: 0 }, { x: 1600, opacity: 1, duration: 1.7, ease: "power1.inOut", immediateRender: false }, a.t); tl.to("#streak", { opacity: 0, duration: 0.25 }, a.t + 1.7); },
          eyebrow: (a) => { tl.fromTo("#eb2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, a.t); tl.to("#eb2", { opacity: 0, duration: 0.28 }, a.t1); },
          dim: (a) => tl.to("#dim", { opacity: a.v, duration: a.dur || 0.4 }, a.t),
          scroll: (a) => { tl.to(scroller, { y: -a.to, duration: a.dur, ease: "power2.inOut" }, a.t); S = a.to; },
          lift: lift,
          chips: (a) => {
            const cs = $$("#chips .chip"), rowH = 96, gap = 22;
            [[0, 1, 2], [3, 4, 5], [6, 7, 8]].forEach((row, r) => {
              const W = row.reduce((w, i) => w + cs[i].offsetWidth, 0) + gap * (row.length - 1);
              let x = 960 - W / 2;
              row.forEach((i) => {
                const c = cs[i], y = a.cy + (r - 1) * rowH - 32, t0 = a.t + i * 0.12;
                gsap.set(c, { x, y });
                x += c.offsetWidth + gap;
                tl.fromTo(c, { opacity: 0, y: y + 30, scale: 0.94 }, { opacity: 1, y, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, t0);
                tl.to(c, { opacity: 0, y: y - 16, duration: 0.3, ease: "power2.in" }, a.t1 - 0.4 + i * 0.02);
              });
            });
          },
          end: (a) => {
            const E = a.t;
            tl.to("#veilB", { opacity: 0, duration: 0.4 }, E);
            tl.to(cam, { filter: "blur(3px)", opacity: 0.85, duration: 0.6, ease: "power2.inOut" }, E);
            tl.to(cam, { scale: 0.53, x: 960 - 0.53 * 880, y: 625 - 0.53 * 500, duration: D - E, ease: "none", force3D: false }, E);
            tl.fromTo("#endFrost", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, E + 0.05);
            tl.fromTo("#endBloom", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.06, duration: 2.4, ease: "power2.out" }, E + 0.05);
            tl.fromTo("#endMark", { opacity: 0, scale: 0.9, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, scale: 1, clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power3.out" }, E + 0.1);
            tl.fromTo("#endSuper", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, E + 0.35);
            tl.fromTo("#endSmall", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, E + 0.85);
            tl.fromTo("#endUrl", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, E + 1.3);
            tl.to(["#endMark", "#endSuper", "#endSmall", "#endUrl"], { y: -10, duration: D - E - 1.4, ease: "sine.inOut" }, E + 1.4);
          },
        };
        DATA.acts.forEach((a) => OPS[a.op](a));
        window.__timelines["main"] = tl;
      }
      tl.set({}, {}, D);
      document.fonts.ready.then(build);
    </script>
  </body>
</html>
