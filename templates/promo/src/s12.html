{{LAPTOP_OPEN}}
<div class="pg" data-page="content"><img src="assets/img/site/screen-content-__CUT__.png" alt="" /></div>
{{LAPTOP_CLOSE}}
<div class="ints" id="INTS"></div>
<div class="minis" id="MINIS"></div>
<div class="threads">
  <div class="th rd" id="RD"><div class="h"><img src="assets/img/logos/reddit.svg" alt="" /><b></b></div><div class="q"></div>
    <div class="rp"><div class="av">Y</div><div><div class="t"></div><span class="chip"></span></div></div></div>
  <div class="th li" id="LI"><div class="h"><img src="assets/img/logos/linkedin.svg" alt="" /><b></b></div><div class="q"></div>
    <div class="rp"><div class="av">Y</div><div><div class="t"></div><span class="chip"></span></div></div></div>
</div>
<div class="supers"></div>
<style>
  .ints, .minis { position: absolute; inset: 0; pointer-events: none; }
  .ic { position: absolute; top: 0; left: 0; width: 360px; }
  .ic img { display: block; width: 100%; }
  .ic .ring { position: absolute; left: 7%; top: 7%; right: 7%; bottom: 7%; border-radius: 30px; box-shadow: 0 0 0 3px rgba(94, 75, 246, 0.85), 0 0 40px 6px rgba(94, 75, 246, 0.35); opacity: 0; }
  .mini { position: absolute; left: 0; top: 0; width: 230px; padding: 16px 18px; border-radius: 16px; background: #fff; box-sizing: border-box;
    box-shadow: inset 0 0 0 1px rgba(23, 22, 28, 0.07), 0 24px 44px -20px rgba(44, 32, 120, 0.5); opacity: 0; }
  .mini b { display: block; font-size: 22px; font-weight: 600; color: var(--violet); }
  .mini span { display: block; margin-top: 4px; font-size: 22px; color: #8d8998; }
  .threads { position: absolute; inset: 0; }
  .th { position: absolute; top: 260px; width: 760px; padding: 30px 34px 30px; border-radius: 28px; background: #fff; box-sizing: border-box; opacity: 0;
    box-shadow: inset 0 0 0 1px rgba(23, 22, 28, 0.07), 0 60px 110px -44px rgba(44, 32, 120, 0.5), 0 16px 32px -16px rgba(26, 23, 20, 0.2); }
  .th.rd { left: 160px; } .th.li { left: 1000px; }
  .th .h { display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; color: var(--ink2); }
  .th .h img { width: 40px; height: 40px; }
  .th .q { margin: 18px 0 22px; font-size: 32px; line-height: 42px; font-weight: 600; letter-spacing: -0.022em; color: var(--ink); }
  .th .rp { display: flex; gap: 16px; padding: 22px 24px; border-radius: 20px; background: #f4f2ff; box-shadow: inset 0 0 0 1.5px rgba(94, 75, 246, 0.35); }
  .th .av { flex: none; width: 46px; height: 46px; border-radius: 14px; background: #0f5c56; color: #fff; font-size: 24px; font-weight: 640; display: flex; align-items: center; justify-content: center; }
  .th .rp .t { font-size: 27px; line-height: 37px; color: var(--ink); letter-spacing: -0.012em; }
  .th .rp .chip { margin-top: 14px; height: 44px; font-size: 22px; }
</style>
<script>
    const { tl, q, qa, C } = S, CT = DATA.CT, R = __RECTS__, LINK = '<svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2" stroke="#5e4bf6" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
    S.dof(0, 6, 0.01);
    S.dim(0, 0.08, 0.01);
    // ---------- the publishing destinations rise; a page lands in each and it lights ----------
    const names = ["wordpress", "webflow", "ghost", "shopify"], W = 360, gap = 34, x0 = 960 - (4 * W + 3 * gap) / 2;
    names.forEach((n, i) => {
      const r = R["int-" + n], h = W * (r.h + 56) / (r.w + 56);
      const c = document.createElement("div"); c.className = "ic"; c.innerHTML = '<img src="assets/img/site/int-' + n + '.png" alt="" /><div class="ring"></div>';
      q("#INTS").appendChild(c);
      Object.assign(c.style, { left: x0 + i * (W + gap) + "px", top: 600 - h / 2 + "px" });
      S.arrive(C.rise + i * 0.09, c, { y: 70 });
      const m = document.createElement("div"); m.className = "mini"; m.innerHTML = "<b></b><span>yourbrand.com</span>"; m.querySelector("b").textContent = CT.pages[i][0];
      q("#MINIS").appendChild(m);
      const tf = C["f" + i];
      gsap.set(m, { x: 960 - 115, y: 230, scale: 0.9 });
      tl.set(m, { opacity: 1 }, tf);
      tl.to(m, { x: x0 + i * (W + gap) + (W - 230) / 2, y: 600 - 45, scale: 0.8, duration: 0.6, ease: "power3.inOut" }, tf);
      tl.to(m, { opacity: 0, scale: 0.6, duration: 0.2, ease: "power2.in" }, tf + 0.55);
      tl.to(c.querySelector(".ring"), { opacity: 1, duration: 0.25, ease: "power2.out" }, tf + 0.55);
      tl.to(c.querySelector(".ring"), { opacity: 0.45, duration: 0.8, ease: "power2.inOut" }, tf + 0.85);
      tl.to(c, { keyframes: [{ y: -12, duration: 0.18, ease: "power2.out" }, { y: 0, duration: 0.5, ease: "back.out(1.2)" }] }, tf + 0.55);
      S.leave(C.out + i * 0.05, c, { y: 50 });
    });
    // ---------- our agents join the threads where buyers ask ----------
    [["#RD", CT.reddit, CT.reddit.sub, CT.reddit.title, C.rd], ["#LI", CT.linkedin, CT.linkedin.who, CT.linkedin.post, C.li]].forEach(([id, o, head, qtext, t]) => {
      const el = q(id);
      el.querySelector(".h b").textContent = head; el.querySelector(".q").textContent = qtext; el.querySelector(".rp .t").textContent = o.reply;
      el.querySelector(".rp .chip").innerHTML = LINK + o.cite;
      tl.fromTo(el, { opacity: 0, y: 60, rotationX: 9, transformPerspective: 1600, transformOrigin: "50% 0%" }, { opacity: 1, y: 0, rotationX: 1.5, duration: 0.95, ease: "back.out(1.2)", immediateRender: true }, t);
      tl.fromTo(el.querySelector(".rp"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: true }, t + 0.45);
      tl.to(el, { y: -8, duration: S.D - t - 1, ease: "sine.inOut" }, t + 0.95);
    });
</script>
