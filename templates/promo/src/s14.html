<!--
{
 "lead": 0.3, "tail": 0.5, "cam0": "HOLD",
 "cues": {"click": "w(0, 'click') - 0.05", "land": "w(1, 'land') - 0.15", "book": "w(2, CT['s14']['book']) - 0.1", "cl": "w(3, CT['s14']['cl']) - 0.15"},
 "supers": [{"t": "B[3]", "text": "@"}],
 "sfx": [["click", "click", 0.3], ["whoosh", "click + 0.25", 0.2], ["roll", "book", 0.2], ["bong", "cl", 0.22]]
}
-->
{{LAPTOP_OPEN}}
<div class="pg" data-page="content"><img src="assets/img/site/screen-content-__CUT__.png" alt="" /></div>
<div class="pg" data-page="land"><div class="lp">
  <div class="nav"><div class="lg"><i>Y</i>Your brand</div><div class="lk"></div><div class="nb"></div></div>
  <div class="hero"><div class="l"><h1></h1><p></p><div class="btns"><span class="b1"></span><span class="b2"></span></div></div>
    <div class="r"><div class="panel"></div></div></div>
</div></div>
{{LAPTOP_CLOSE}}
<div class="vk" id="Vk">{{CARD:card:won}}</div>
<div class="vc" id="Vc">{{COMPOSER:cmp:@typed}}</div>
<div class="toasts"><div class="toast" id="T1"><i class="ok"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i><div><b></b><span></span></div></div>
  <div class="toast" id="T2"><img src="assets/img/logos/chatgpt.svg" alt="" /><div><b></b><span></span></div></div></div>
<div class="cursor" id="CUR"><svg width="34" height="44" viewBox="0 0 30 40"><path d="M3 2 L3 30 L10 23.5 L14.6 34.4 L19.2 32.5 L14.6 21.8 L24 21.4 Z" fill="#111" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"></path></svg></div>
<div class="supers"></div>
<style>
  .vc, .vk { position: absolute; left: 360px; }
  .vc { top: 248px; }
  .vk { top: 380px; }
  .cursor { position: absolute; left: 0; top: 0; z-index: 30; }
  .lp { position: absolute; inset: 0; background: linear-gradient(180deg, #fbfaf7, #f2efe9); font-family: "Inter", sans-serif; color: #14201f; }
  .lp .nav { display: flex; align-items: center; height: 92px; padding: 0 72px; }
  .lp .lg { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
  .lp .lg i { width: 44px; height: 44px; border-radius: 12px; background: #0f5c56; color: #fff; font-style: normal; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  .lp .lk { display: flex; gap: 40px; margin-left: 80px; font-size: 22px; color: #4a5654; }
  .lp .nb { margin-left: auto; height: 50px; line-height: 50px; padding: 0 24px; border-radius: 14px; background: #0f5c56; color: #fff; font-size: 22px; font-weight: 600; }
  .lp .hero { display: flex; gap: 60px; padding: 110px 72px 0; }
  .lp .l { flex: 1.15; }
  .lp h1 { margin: 0; font-size: 78px; line-height: 84px; font-weight: 680; letter-spacing: -0.045em; }
  .lp p { margin: 28px 0 40px; font-size: 30px; line-height: 42px; color: #4a5654; letter-spacing: -0.01em; }
  .lp .btns { display: flex; gap: 16px; }
  .lp .b1, .lp .b2 { height: 66px; line-height: 66px; padding: 0 30px; border-radius: 16px; font-size: 25px; font-weight: 600; }
  .lp .b1 { background: #0f5c56; color: #fff; box-shadow: 0 16px 30px -14px rgba(15, 92, 86, 0.7); }
  .lp .b2 { box-shadow: inset 0 0 0 1.5px rgba(20, 32, 31, 0.2); }
  .lp .r { flex: 1; }
  .lp .panel { border-radius: 28px; background: #fff; padding: 30px 32px; box-shadow: 0 40px 80px -40px rgba(15, 50, 46, 0.4), inset 0 0 0 1px rgba(20, 32, 31, 0.06); }
  .lp .st { display: flex; gap: 18px; padding: 18px 0; }
  .lp .st + .st { box-shadow: inset 0 1px 0 rgba(20, 32, 31, 0.08); }
  .lp .st i { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #e3efed; color: #0f5c56; font-style: normal; font-weight: 650; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  .lp .st b { display: block; font-size: 27px; font-weight: 640; letter-spacing: -0.02em; }
  .lp .st span { display: block; margin-top: 4px; font-size: 23px; color: #56625f; }
  .toasts { position: absolute; inset: 0; pointer-events: none; }
  .toast { position: absolute; left: 1180px; width: 600px; display: flex; align-items: center; gap: 18px; padding: 24px 28px; border-radius: 22px; background: #fff; box-sizing: border-box; opacity: 0;
    box-shadow: inset 0 0 0 1px rgba(23, 22, 28, 0.07), 0 50px 90px -40px rgba(44, 32, 120, 0.55), 0 14px 28px -14px rgba(26, 23, 20, 0.2); }
  #T1 { top: 640px; } #T2 { top: 770px; }
  .toast .ok { flex: none; width: 52px; height: 52px; border-radius: 50%; background: #1f9d67; color: #fff; font-style: normal; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .toast img { flex: none; width: 52px; height: 52px; }
  .toast b { display: block; font-size: 30px; font-weight: 640; letter-spacing: -0.02em; color: var(--ink); }
  .toast span { display: block; margin-top: 2px; font-size: 23px; color: var(--ink3); }
</style>
<script>
    const { tl, q, qa, C } = S, CT = DATA.CT, LD = CT.landing;
    // the landing page, from the cut's content
    q(".lp .lk").innerHTML = LD.nav.map((n) => "<span>" + n + "</span>").join("");
    q(".lp .nb").textContent = LD.cta; q(".lp h1").textContent = LD.head; q(".lp p").textContent = LD.sub;
    q(".lp .b1").textContent = LD.cta; q(".lp .b2").textContent = LD.cta2;
    q(".lp .panel").innerHTML = LD.steps.map(([b, s], i) => '<div class="st"><i>' + (i + 1) + "</i><div><b>" + b + "</b><span>" + s + "</span></div></div>").join("");
    q("#T1 b").textContent = LD.toast1; q("#T1 span").textContent = "via yourbrand.com";
    q("#T2 b").textContent = LD.toast2; q("#T2 span").textContent = LD.via;

    const cmp = S.Composer(q("#cmp")), K = S.Card(q("#card"));
    cmp.shown(2); cmp.caret(0, 0); K.full();
    S.dof(0, 8, 0.01);
    S.dim(0, 0.06, 0.01);
    // ---------- they click ----------
    const ch = K.rows[0].querySelector(".chip"), R0 = S.root.getBoundingClientRect(), cr = ch.getBoundingClientRect();
    const cx = cr.left - R0.left + cr.width * 0.42, cy = cr.top - R0.top + cr.height * 0.55, cur = q("#CUR");
    gsap.set(cur, { x: 1560, y: 1000, opacity: 0 });
    tl.to(cur, { opacity: 1, duration: 0.2 }, C.click - 0.8);
    tl.to(cur, { x: cx, duration: 0.75, ease: "power2.inOut" }, C.click - 0.78);
    tl.to(cur, { y: cy, duration: 0.75, ease: "sine.inOut" }, C.click - 0.78);
    tl.to(cur.querySelector("svg"), { scale: 0.86, duration: 0.07, transformOrigin: "10% 5%" }, C.click - 0.03);
    tl.to(cur.querySelector("svg"), { scale: 1, duration: 0.18 }, C.click + 0.05);
    tl.to(ch, { scale: 0.95, duration: 0.07 }, C.click - 0.03);
    tl.to(ch, { scale: 1, duration: 0.25, ease: "back.out(1.2)" }, C.click + 0.05);
    // ---------- they land on your site ----------
    tl.to(cur, { opacity: 0, duration: 0.2 }, C.click + 0.3);
    S.leave(C.click + 0.25, q("#Vc"), { y: -40 });
    S.leave(C.click + 0.3, q("#Vk"), { y: -20 });
    S.dof(C.land - 0.35, 0, 0.6);
    S.dim(C.land - 0.35, 0, 0.6);
    S.page(C.land - 0.15, "land", 0.6);
    S.cam(C.land + 0.2, "NEAR", 1.4, "power2.inOut");  // a gentle push that keeps the laptop above the caption band
    // ---------- they book a call; a new client, sent by AI ----------
    tl.fromTo(q("#T1"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: "back.out(1.2)", immediateRender: true }, C.book);
    tl.fromTo(q("#T2"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: "back.out(1.2)", immediateRender: true }, C.cl);
    tl.to([q("#T1"), q("#T2")], { y: -8, duration: S.D - C.cl - 0.9, ease: "sine.inOut" }, C.cl + 0.8);
</script>
