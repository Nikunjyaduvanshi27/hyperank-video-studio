 "lead": 0.3, "tail": 0.5, "cam0": "HOLD",
 "cues": {"ty": "0.25", "book": "B[1] - 0.15", "dom": "w(2, 'domain') - 0.3", "min": "w(3, 'minutes') - 0.35", "see": "w(3, 'answer') - 0.2", "go": "w(3, 'names') - 0.1"},
 "supers": [{"t": "B[1] - 0.05", "text": "@"}],
 "typing": [["ty", "ty + 2.3", 0.15], ["dom", "dom + 0.75", 0.14]],
 "sfx": [["whoosh", "book", 0.2], ["tick", "min", 0.14], ["tick", "see", 0.14], ["click", "go", 0.26]]
}
-->
{{LAPTOP_OPEN}}
<div class="pg" data-page="top"><img src="assets/img/site/top.png" alt="" /></div>
{{LAPTOP_CLOSE}}
<div class="vc" id="Vc">{{COMPOSER:cmp:What does AI say about my brand right now?}}</div>
<div class="calW" id="CAL"><div class="cal">
  <div class="hd"><img src="assets/img/hyperank-mark.png" alt="" /><b>Talk to us</b><em>30 min</em></div>
  <div class="lb">Your domain</div>
  <div class="in"><span class="dm"></span><i class="cr"></i></div>
  <div class="slots"><span>Tue 10:00</span><span>Tue 14:30</span><span>Wed 11:00</span></div>
  <div class="ft"><span class="btn">Book a call</span><span class="url">hyperank.ai/book</span></div>
</div></div>
<div class="supers"></div>
<style>
  .vc { position: absolute; left: 360px; top: 448px; }
  .calW { position: absolute; left: 510px; top: 360px; width: 900px; opacity: 0; }
  .cal { border-radius: 30px; background: #fff; padding: 34px 42px 34px; box-shadow: inset 0 0 0 1px rgba(23, 22, 28, 0.07), 0 70px 120px -48px rgba(44, 32, 120, 0.55), 0 18px 34px -16px rgba(26, 23, 20, 0.22); }
  .cal .hd { display: flex; align-items: center; gap: 16px; }
  .cal .hd img { width: 44px; height: 41px; }
  .cal .hd b { font-size: 38px; font-weight: 660; letter-spacing: -0.035em; }
  .cal .hd em { margin-left: auto; font-style: normal; height: 46px; line-height: 46px; padding: 0 18px; border-radius: 14px; background: #efedfe; color: #2e2391; font-size: 24px; font-weight: 620; }
  .cal .lb { margin-top: 26px; font-size: 23px; font-weight: 560; color: var(--ink3); }
  .cal .in { position: relative; margin-top: 10px; height: 68px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px rgba(23, 22, 28, 0.14); padding: 0 22px; display: flex; align-items: center; font-size: 30px; font-weight: 500; color: var(--ink); }
  .cal .in .cr { width: 3px; height: 34px; margin-left: 2px; background: var(--violet); border-radius: 2px; opacity: 0; }
  .cal .slots { display: flex; gap: 14px; margin-top: 24px; }
  .cal .slots span { flex: 1; height: 62px; line-height: 62px; text-align: center; border-radius: 16px; font-size: 25px; font-weight: 560; color: var(--ink2); box-shadow: inset 0 0 0 1.5px rgba(23, 22, 28, 0.12); }
  .cal .ft { display: flex; align-items: center; gap: 22px; margin-top: 28px; }
  .cal .btn { height: 70px; line-height: 70px; padding: 0 38px; border-radius: 18px; background: var(--violet); color: #fff; font-size: 28px; font-weight: 640; box-shadow: 0 18px 34px -14px rgba(72, 54, 224, 0.75); }
  .cal .url { font-size: 26px; font-weight: 520; color: var(--ink2); }
</style>
<script>
    const { tl, q, qa, C } = S;
    const cmp = S.Composer(q("#cmp"));
    S.dof(0, 8, 0.01);
    S.dim(0, 0.06, 0.01);
    // ---------- the closing question ----------
    S.arrive(0, q("#Vc"), { y: 24 });
    const te = cmp.type(C.ty, 0, 18);
    cmp.blink(te + 0.05, C.book + 0.2);
    tl.to(q("#Vc"), { y: -230, duration: 0.85, ease: "power3.inOut" }, C.book - 0.05);
    cmp.caret(C.book + 0.4, 0);
    // ---------- book a call; bring your domain ----------
    S.arrive(C.book + 0.1, q("#CAL"), { y: 60 });
    const dm = q("#CAL .dm"), D0 = "yourbrand.com";
    dm.innerHTML = Array.from(D0).map((c) => "<span>" + c + "</span>").join("");
    const cs = qa("#CAL .dm span"); gsap.set(cs, { opacity: 0 });
    tl.set(q("#CAL .cr"), { opacity: 1 }, C.dom - 0.1);
    cs.forEach((c, i) => tl.set(c, { opacity: 1 }, C.dom + i * 0.055));
    tl.set(q("#CAL .cr"), { opacity: 0 }, C.see);
    // ---------- thirty minutes; see your answer ----------
    const badge = q("#CAL .hd em");
    tl.to(badge, { scale: 1.1, duration: 0.25, ease: "power2.out" }, C.min);
    tl.to(badge, { scale: 1, duration: 0.5, ease: "back.out(1.2)" }, C.min + 0.25);
    const slot = qa("#CAL .slots span")[1];
    tl.to(slot, { backgroundColor: "#efedfe", color: "#2e2391", boxShadow: "inset 0 0 0 2px rgba(94,75,246,0.8)", duration: 0.35, ease: "power2.out" }, C.see);
    const btn = q("#CAL .btn");
    tl.to(btn, { scale: 0.95, duration: 0.08 }, C.go);
    tl.to(btn, { scale: 1, duration: 0.4, ease: "back.out(1.2)" }, C.go + 0.08);
    tl.fromTo(btn, { boxShadow: "0 18px 34px -14px rgba(72,54,224,0.75), 0 0 0 0 rgba(94,75,246,0.5)" }, { boxShadow: "0 18px 34px -14px rgba(72,54,224,0.75), 0 0 0 22px rgba(94,75,246,0)", duration: 0.8, ease: "power2.out", immediateRender: false }, C.go);
    tl.to(q("#CAL"), { y: -8, duration: S.D - C.book - 1.2, ease: "sine.inOut" }, C.book + 1.0);
</script>
