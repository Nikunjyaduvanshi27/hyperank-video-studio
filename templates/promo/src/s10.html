{{LAPTOP_OPEN}}
<div class="pg" data-page="src"><img src="assets/img/site/screen-sources-__CUT__.png" alt="" /></div>
{{LAPTOP_CLOSE}}
<div class="lifts">
  <div class="lift tbl" id="T"><img src="assets/img/site/sources-table-__CUT__.png" alt="" /></div>
</div>
<div class="vk" id="Vk">{{CARD:card:known}}</div>
<div class="vc" id="Vc">{{COMPOSER:cmp:Why does AI pick them?}}</div>
<div class="fly"></div>
<div class="supers"></div>
<style>
  .vc, .vk { position: absolute; left: 360px; }
  .vc { top: 448px; }
  .vk { top: 300px; }
  .fly { position: absolute; inset: 0; pointer-events: none; }
  .fly .chip { position: absolute; left: 0; top: 0; transform-origin: 0 0; margin: 0; }
  .tbl { border-radius: 14px; box-shadow: 0 60px 110px -40px rgba(44, 32, 120, 0.5), 0 18px 34px -16px rgba(26, 23, 20, 0.22); }
  .tbl .cov { position: absolute; background: #fff; transform-origin: 100% 50%; }
  .tbl .lite { position: absolute; border-radius: 10px; opacity: 0; overflow: hidden; box-shadow: 0 0 0 0 rgba(94, 75, 246, 0.5); }
  .tbl .lite i { position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0)); }
  .tbl .uline { position: absolute; height: 5px; border-radius: 3px; background: var(--violet); transform-origin: 0 50%; transform: scaleX(0); }
</style>
<script>
    const { tl, q, qa, C } = S, R = __RECTS__;
    const cmp = S.Composer(q("#cmp")), K = S.Card(q("#card"));
    K.full();
    S.dof(0, 8, 0.01);

    // ---------- the viewer asks; the answer they already saw comes back ----------
    tl.fromTo(q("#Vc"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: true }, 0);
    const tyEnd = cmp.type(C.ty, 0, 18);
    cmp.blink(tyEnd + 0.05, C.send);
    cmp.send(C.send);
    cmp.caret(C.send, 0);
    tl.to(q("#Vc"), { y: -280, duration: 0.75, ease: "power3.inOut" }, C.send + 0.05);
    gsap.set(q("#card"), { opacity: 0 });
    tl.set(q("#card"), { opacity: 1 }, C.send + 0.1);
    // the same answer returns: it unfolds downward and settles, then its clip opens for the shadow
    const H = q("#card").offsetHeight;
    tl.fromTo(q("#card"), { clipPath: "inset(-120px 0px " + H + "px 0px round 32px)", y: -16 }, { clipPath: "inset(-120px 0px 0px 0px round 32px)", y: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, C.send + 0.1);
    tl.to(q("#card"), { clipPath: "inset(-120px -140px -170px -140px round 32px)", duration: 0.5, ease: "power2.out" }, C.send + 0.9);
    // "the sources it trusts": the citation chips light up
    tl.to(K.chips, { backgroundColor: "#f1efff", boxShadow: "inset 0 0 0 2px rgba(94,75,246,0.85), 0 12px 26px -10px rgba(94,75,246,0.55)", color: "#2e2391", duration: 0.35, ease: "power2.out", stagger: 0.15 }, C.glow);

    // ---------- focus racks to the laptop; the sources table lifts out of the screen ----------
    tl.to(q("#Vc"), { opacity: 0, y: -330, duration: 0.5, ease: "power2.in" }, C.det);
    tl.to(q("#card"), { opacity: 0, scale: 0.95, y: -24, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, C.det);
    S.dof(C.det, 0, 0.6);
    const box = R["screen-sources"], P = R["sources-table"], from = { x: box.x, y: box.y, w: box.w, h: box.h };
    const T = S.lift(C.det + 0.38, q("#T"), from, { cx: 960, cy: 604, w: 1340 }, { tilt: 4, rest: 1 });
    S.dof(C.det + 0.9, 3, 0.6);
    S.dim(C.det + 0.9, 0.12, 0.6);
    tl.to(q("#T"), { y: T.y - 8, duration: S.D - C.det - 2, ease: "sine.inOut" }, C.det + 1.0);
    const k = T.k, tb = q("#T");
    const px = (r) => ({ left: r.x * k + "px", top: r.y * k + "px", width: r.w * k + "px", height: r.h * k + "px" });
    // each row stays white until its source lands on it
    const covers = P.rows.map((rw) => { const c = document.createElement("div"); c.className = "cov"; Object.assign(c.style, px({ x: rw.row.x, y: rw.row.y, w: rw.row.w, h: rw.row.h - 1 })); tb.appendChild(c); return c; });

    // ---------- each citation chip drops into its row, and the row unfolds from it ----------
    const sc = (13 * T.k) / 23, R0 = S.root.getBoundingClientRect();  // the chip lands at the table's own domain size
    K.chips.forEach((ch, i) => {
      const f = ch.cloneNode(true); q(".fly").appendChild(f);
      const cr = ch.getBoundingClientRect(), x0 = cr.left - R0.left, y0 = cr.top - R0.top;
      gsap.set(f, { x: x0, y: y0, opacity: 0, backgroundColor: "#f1efff", boxShadow: "inset 0 0 0 2px rgba(94,75,246,0.85), 0 12px 26px -10px rgba(94,75,246,0.55)", color: "#2e2391" });
      tl.set(f, { opacity: 1 }, C.det);
      tl.set(ch, { opacity: 0 }, C.det);
      const d = P.rows[i].domain, tx = T.x + d.x * k - 46 * sc, ty = T.y + (d.y + d.h / 2) * k - 25 * sc;
      tl.to(f, { y: y0 + 26, duration: 0.5, ease: "power2.out" }, C.det);
      const tf = C["f" + i];
      tl.to(f, { x: tx, y: ty, scale: sc, duration: 0.62, ease: "power3.inOut" }, tf);
      tl.to(f, { backgroundColor: "rgba(255,255,255,0)", boxShadow: "inset 0 0 0 0 rgba(94,75,246,0)", color: "#0f172a", duration: 0.25, ease: "power1.out" }, tf + 0.5);
      tl.to(f.querySelector("svg"), { opacity: 0, duration: 0.2 }, tf + 0.45);
      tl.to(covers[i], { opacity: 0, duration: 0.42, ease: "power1.inOut" }, tf + 0.56);  // the row resolves whole around its source
      tl.to(f, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, tf + 0.62);
    });

    // ---------- "finds the exact sources": the Add buttons light in sequence ----------
    P.rows.forEach((rw, i) => {
      const l = document.createElement("div"); l.className = "lite"; l.innerHTML = "<i></i>";
      Object.assign(l.style, px(rw.add)); tb.appendChild(l);
      const t = C["a" + i];
      tl.to(l, { opacity: 1, boxShadow: "0 0 0 10px rgba(94,75,246,0.22), 0 14px 30px -6px rgba(94,75,246,0.65)", duration: 0.35, ease: "power2.out" }, t);
      gsap.set(l.querySelector("i"), { xPercent: -120 });
      tl.fromTo(l.querySelector("i"), { xPercent: -120 }, { xPercent: 240, duration: 0.55, ease: "power1.inOut", immediateRender: false }, t + 0.05);
      tl.to(l, { boxShadow: "0 0 0 4px rgba(94,75,246,0.16), 0 10px 22px -8px rgba(94,75,246,0.45)", duration: 0.6, ease: "power2.inOut" }, t + 0.45);
    });
    // "deciding your answer": the table's own title is underlined
    const u = document.createElement("div"); u.className = "uline";
    Object.assign(u.style, { left: P.header.x * k + "px", top: (P.header.y + P.header.h + 3) * k + "px", width: 176 * k + "px" });
    tb.appendChild(u);
    tl.to(u, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, C.dec);
</script>
