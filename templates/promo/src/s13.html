 "lead": 0.3, "tail": 0.6, "cam0": "HOLD",
 "cues": {"ty": "0.28", "send": "E[0] - 0.2", "r0": "w(1, 'names') - 0.42", "lk": "w(1, 'links') - 0.1"},
 "supers": [{"t": "0.4", "text": "@"}],
 "typing": [["ty", "ty + 1.95", 0.15]],
 "sfx": [["click2", "send", 0.3], ["whoosh", "send + 0.1", 0.2], ["bong", "r0 + 0.45", 0.26], ["roll", "r0 + 0.45", 0.14], ["roll", "r0 + 0.9", 0.13], ["tick", "lk", 0.18]]
}
-->
{{LAPTOP_OPEN}}
<div class="pg" data-page="content"><img src="assets/img/site/screen-content-__CUT__.png" alt="" /></div>
{{LAPTOP_CLOSE}}
<div class="vk" id="Vk">{{CARD:card:won}}</div>
<div class="vc" id="Vc">{{COMPOSER:cmp:@typed}}</div>
<div class="supers"></div>
<style>
  .vc, .vk { position: absolute; left: 360px; }
  .vc { top: 248px; }
  .vk { top: 380px; }
</style>
<script>
    const { tl, q, qa, C } = S, CT = DATA.CT;
    const cmp = S.Composer(q("#cmp")), K = S.Card(q("#card"));
    S.dof(0, 8, 0.01);
    S.dim(0, 0.06, 0.01);
    // ---------- weeks later, the same question ----------
    gsap.set(q("#Vc"), { y: 200 });
    S.arrive(0, q("#Vc .cmp"), { y: 24 });
    const te = cmp.type(C.ty, 2, 24);
    cmp.blink(te + 0.05, C.send);
    cmp.send(C.send);
    cmp.caret(C.send, 0);
    tl.to(q("#Vc"), { y: 0, duration: 0.8, ease: "power3.inOut" }, C.send + 0.1);
    // ---------- this time, AI names you, and links to you ----------
    const card = q("#card"), H = card.offsetHeight, rowsTop = q("#card .rows").offsetTop, RH = K.rows[0].offsetHeight;
    const clip = (vis) => "inset(-120px 0px " + Math.max(0, H - vis) + "px 0px round 32px)";
    K.hide();
    gsap.set(card, { clipPath: clip(0) });
    tl.fromTo(card, { y: -16 }, { y: 0, duration: 0.85, ease: "back.out(1.2)", immediateRender: false }, C.send + 0.35);
    tl.to(card, { clipPath: clip(rowsTop + 4), duration: 0.6, ease: "power3.out" }, C.send + 0.35);
    K.stream(C.send + 0.4, 0.55);
    K.rows.forEach((r, i) => {
      const t = C.r0 + i * 0.45;
      K.row(t, i, 0.7);
      tl.to(card, { clipPath: clip(i < 2 ? rowsTop + (i + 1) * RH + 8 : H), duration: 0.55, ease: "power3.out" }, t);
    });
    tl.to(card, { clipPath: "inset(-120px -140px -170px -140px round 32px)", duration: 0.6, ease: "power2.out" }, C.r0 + 1.5);
    // your row lands with a soft glow; its citation lights on "links"
    tl.fromTo(K.rows[0], { boxShadow: "0 0 0 0 rgba(94,75,246,0)" }, { boxShadow: "0 0 0 10px rgba(94,75,246,0.08)", duration: 0.6, ease: "power2.out", immediateRender: false }, C.r0 + 0.45);
    const ch = K.rows[0].querySelector(".chip");
    tl.to(ch, { scale: 1.08, duration: 0.25, ease: "power2.out" }, C.lk);
    tl.to(ch, { scale: 1, duration: 0.5, ease: "back.out(1.2)" }, C.lk + 0.25);
    tl.fromTo(ch, { boxShadow: "inset 0 0 0 1.5px rgba(94,75,246,0.55), 0 0 0 0 rgba(94,75,246,0.5)" }, { boxShadow: "inset 0 0 0 1.5px rgba(94,75,246,0.55), 0 0 0 16px rgba(94,75,246,0)", duration: 0.8, ease: "power2.out", immediateRender: false }, C.lk);
</script>
